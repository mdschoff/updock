name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./internal/...
      - name: End-to-end test (real Docker)
        run: go test -v -timeout 300s ./e2e/
      - name: Build
        run: go build ./cmd/updock
